name: Deploy Supabase (Migrations & Edge Functions)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/provision-supabase.mjs"
      - ".github/workflows/deploy-supabase.yml"

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provision or resolve Supabase project & apply SQL migrations
        id: sb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          node scripts/provision-supabase.mjs --provision

      - uses: supabase/setup-cli@v1
        if: steps.sb.outputs.configured == 'true'
        with:
          version: latest

      - name: Sync Edge Function secrets (Gemini & optional Firebase)
        if: steps.sb.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ steps.sb.outputs.project_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          JIMAKU_API_KEY: ${{ secrets.JIMAKU_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          OPENSUBTITLES_USERNAME: ${{ secrets.OPENSUBTITLES_USERNAME }}
          OPENSUBTITLES_PASSWORD: ${{ secrets.OPENSUBTITLES_PASSWORD }}
        run: |
          ARGS=("WEB_BASE_PATH=/Tatani")
          if [ -n "$GEMINI_API_KEY" ]; then
            ARGS+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            ARGS+=("FIREBASE_SERVICE_ACCOUNT_JSON=$FIREBASE_SERVICE_ACCOUNT_JSON")
          fi
          if [ -n "$JIMAKU_API_KEY" ]; then
            ARGS+=("JIMAKU_API_KEY=$JIMAKU_API_KEY")
          fi
          if [ -n "$SUBDL_API_KEY" ]; then
            ARGS+=("SUBDL_API_KEY=$SUBDL_API_KEY")
          fi
          if [ -n "$OPENSUBTITLES_API_KEY" ]; then
            ARGS+=("OPENSUBTITLES_API_KEY=$OPENSUBTITLES_API_KEY")
          fi
          if [ -n "$OPENSUBTITLES_USERNAME" ]; then
            ARGS+=("OPENSUBTITLES_USERNAME=$OPENSUBTITLES_USERNAME")
          fi
          if [ -n "$OPENSUBTITLES_PASSWORD" ]; then
            ARGS+=("OPENSUBTITLES_PASSWORD=$OPENSUBTITLES_PASSWORD")
          fi
          supabase secrets set --yes --project-ref "$PROJECT_ID" "${ARGS[@]}"

      - name: Deploy all Supabase Edge Functions
        if: steps.sb.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ steps.sb.outputs.project_id }}
        run: |
          supabase functions deploy --yes --project-ref "$PROJECT_ID"
