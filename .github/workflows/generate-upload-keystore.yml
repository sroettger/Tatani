name: Generate Play Upload Keystore (One-Time Setup)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate 2048-bit RSA PKCS12 upload keystore
        run: |
          mkdir -p /tmp/keystore-out
          KEY_ALIAS="tatani-upload"
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$STORE_PASS"

          keytool -genkeypair -v \
            -keystore /tmp/keystore-out/tatani-upload.keystore \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Tatani, O=Tatani, L=App, ST=NA, C=US" >/dev/null 2>&1

          KEYSTORE_B64="$(base64 -w 0 /tmp/keystore-out/tatani-upload.keystore)"

          cat <<EOF > /tmp/keystore-out/github-actions-secrets.txt
          Add these 4 Repository Secrets in GitHub:
          Settings -> Secrets and variables -> Actions -> New repository secret

          1) ANDROID_KEY_ALIAS
          $KEY_ALIAS

          2) ANDROID_KEYSTORE_PASSWORD
          $STORE_PASS

          3) ANDROID_KEY_PASSWORD
          $KEY_PASS

          4) ANDROID_KEYSTORE_BASE64
          $KEYSTORE_B64

          IMPORTANT:
          - Save a backup of this file in a password manager (e.g., 1Password / Bitwarden / Google Password Manager).
          - Delete this GitHub Actions workflow run once you have copied the 4 secrets.
          EOF

      - name: Upload short-lived private setup artifact (expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: tatani-upload-keystore-setup
          path: |
            /tmp/keystore-out/github-actions-secrets.txt
            /tmp/keystore-out/tatani-upload.keystore
          retention-days: 1
