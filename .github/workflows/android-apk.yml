name: Build & Publish Android (Google Play + Preview)

on:
  workflow_dispatch:
    inputs:
      publish_play_internal:
        description: "Upload signed release AAB to Google Play Internal Testing (requires PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        default: true
      version_code_override:
        description: "Optional explicit integer versionCode override"
        type: string
        default: ""
  push:
    branches: [main, native-android-play-store]
    tags: ["v*-android.*"]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compute monotonic Android versionCode
        id: ver
        env:
          OVERRIDE: ${{ inputs.version_code_override }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            VC="$OVERRIDE"
          else
            VC=$(( $(date +%s) / 10 ))
          fi
          VN="2.0.${RUN_NUM}"
          echo "version_code=${VC}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VN}" >> "$GITHUB_OUTPUT"
          echo "Using versionCode=${VC}, versionName=${VN}"

      - name: Resolve Supabase URL & public key automatically
        id: sb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          node scripts/provision-supabase.mjs --resolve

      - name: Verify web tests & production bundle
        env:
          VITE_SUPABASE_URL: ${{ steps.sb.outputs.supabase_url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.sb.outputs.supabase_anon_key }}
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Run native Kotlin unit tests & build debug APK/AAB
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          SUPABASE_URL: ${{ steps.sb.outputs.supabase_url }}
          SUPABASE_ANON_KEY: ${{ steps.sb.outputs.supabase_anon_key }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug bundleDebug --no-daemon

      - name: Stage debug artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tatani-android-debug.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab tatani-android-debug.aab

      - name: Check Play signing secrets
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          echo "has_keystore=${HAS_KEYSTORE}" >> "$GITHUB_OUTPUT"
          echo "has_play_json=${HAS_PLAY_JSON}" >> "$GITHUB_OUTPUT"

      - name: Build signed Google Play release AAB (R8 + symbol tables)
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ steps.sb.outputs.supabase_url }}
          SUPABASE_ANON_KEY: ${{ steps.sb.outputs.supabase_anon_key }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > /tmp/tatani-upload.keystore
          export ANDROID_KEYSTORE_PATH=/tmp/tatani-upload.keystore
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "../tatani-release-${ANDROID_VERSION_CODE}.aab"
          cp app/build/outputs/bundle/release/app-release.aab ../tatani-android-release.aab
          cp app/build/outputs/mapping/release/mapping.txt ../tatani-r8-mapping.txt
          rm -f /tmp/tatani-upload.keystore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tatani-android-v${{ steps.ver.outputs.version_code }}
          path: |
            tatani-android-debug.apk
            tatani-release-${{ steps.ver.outputs.version_code }}.aab
            tatani-r8-mapping.txt
          if-no-files-found: ignore

      - name: Upload signed AAB to Google Play Internal Testing
        if: >-
          steps.signing.outputs.has_keystore == 'true' &&
          steps.signing.outputs.has_play_json == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_play_internal == true)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tsuro.tatani
          releaseFiles: tatani-android-release.aab
          mappingFile: tatani-r8-mapping.txt
          track: internal
          status: completed

      - name: Publish GitHub Pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(tatani-android-debug.apk tatani-android-debug.aab)
          if [ -f tatani-android-release.aab ]; then
            ASSETS+=(tatani-android-release.aab)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --prerelease \
              --title "Tatani Native Android ($TAG)" \
              --notes $'Native Kotlin + Jetpack Compose Android 16 (API 36) build of Tatani (`com.tsuro.tatani`, minSdk 24 / targetSdk 36).\n\n### Install via Google Play Store (no sideloading)\n- **Google Play Internal Testing Track**: Upload **`tatani-android-release.aab`** once to **Testing → Internal testing** in Play Console (and add `PLAY_SERVICE_ACCOUNT_JSON` to GitHub Secrets for automatic future uploads).\n- **Instant Play Store Install (Internal App Sharing)**: Upload **`tatani-android-release.aab`** at `https://play.google.com/console/internal-app-sharing`.'
          fi
