name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-capacitor-app]
    tags: ["v*-android.*"]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle & sync Android
        run: bun run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tatani-android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tatani-android-debug
          path: tatani-android-debug.apk

      - name: Publish GitHub Pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" tatani-android-debug.apk --clobber
          else
            gh release create "$TAG" tatani-android-debug.apk \
              --prerelease \
              --title "Tatani Android Preview ($TAG)" \
              --notes $'Installable Android debug APK for Tatani (`app.tatani.android`, minSdk 22 / targetSdk 34).\n\n### How to install on Android\n1. Download **`tatani-android-debug.apk`** below on your Android device.\n2. Tap the downloaded APK and allow **Install unknown apps** for your browser / Files app when prompted.\n3. Open **Tatani** and sign in with your **email & password**.\n\n### Notes for this preview\n- **Email & password sign-in** and all anime library, flashcard study, SRS, subtitles, and AI tutor features work directly against Supabase.\n- **Google Sign-In** requires deep-link OAuth setup on the server (currently shows a friendly reminder to use email & password).\n- **Push notifications**: Web Push (`firebase-messaging-sw.js`) does not run inside Android WebView; native Android FCM push can be wired up next once `google-services.json` from the `tatani-3ed3c` Firebase console is added to `android/app/`.'
          fi
