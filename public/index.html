<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tatani — Contextual Anime Japanese SRS for Android</title>
    <meta name="description" content="Tatani is a native Android app (com.tsuro.tatani) for contextual anime Japanese vocabulary learning." />
    <link rel="icon" type="image/png" href="./icon-512.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1116;
        color: #f4f1ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        line-height: 1.6;
        padding: 24px;
      }
      main {
        max-width: 520px;
        width: 100%;
        background: #171a22;
        border: 1px solid #262b38;
        border-radius: 20px;
        padding: 32px 28px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        color: #b4b8c4;
        font-size: 0.96rem;
        margin: 0 0 20px;
      }
      a {
        color: #e2533c;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { text-decoration: underline; }
      .meta {
        margin-top: 16px;
        font-size: 0.8rem;
        color: #8b90a0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon-512.png" alt="Tatani icon" />
      <h1>Tatani for Android</h1>
      <p>
        Contextual Japanese vocabulary &amp; comprehension trainer built natively for Android
        (<code>com.tsuro.tatani</code>) on Google Play.
      </p>
      <a href="./privacy/">Privacy Policy &amp; Account Deletion &rarr;</a>
      <div class="meta">Package ID: <code>com.tsuro.tatani</code></div>
    </main>
  </body>
</html>
